"$schema" = 'https://starship.rs/config-schema.json'

palette = "sakura"
add_newline = true
command_timeout = 2000

format = "[╭─](gray)[](root)$os[](fg:root bg:trunk)$hostname$directory$git_branch$git_status$time$nodejs$python$rust$golang$lua$line_break[╰─](gray)$status$character"

# WezTerm の color_scheme = "Sakura" (iTerm2-Color-Schemes) と同じ配色
[palettes.sakura]
pink         = "#dd7bdc"
bright_pink  = "#ff65fd"
purple       = "#9892f1"
green        = "#41af1a"
bright_green = "#22e529"
muted_green  = "#96ac8e" # grayと同等の彩度・明度に合わせた成功色(character用)
red          = "#d52370"
bright_red   = "#f41d99"
muted_red    = "#ac8e9b" # grayと同等の彩度・明度に合わせた失敗色(character用)
peach        = "#bc7053"
root         = "#412d1b" # 根: 木質のグラデーション(os用)
trunk        = "#7a522e" # 幹: 同上(hostname/directory用)
gray         = "#998eac"
white        = "#eeeeee"
dark         = "#24242e" # selection_fg / cursor_fg: 明るい背景の上に乗せる文字色

# hostname自身が矢印を持つことで、hostname非表示時(通常のローカルセッション)は
# 矢印も一緒に消え、ディレクトリの幹(trunk)帯がそのまま始まる
[os]
disabled = false
style = "bg:root fg:white"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = ""
Macos    = ""
Linux    = ""
Ubuntu   = ""

[hostname]
ssh_only = true
format = "[$hostname ]($style)[](fg:gray bg:trunk) "
style = "bold gray"

[directory]
style = "bg:trunk fg:white"
format = "[ $path$read_only ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
use_os_path_sep = false
read_only = " "
read_only_style = "bright_red"

[time]
disabled = false
style = "bg:pink fg:dark"
format = "[ $time ]($style)"
time_format = "%H:%M:%S"

[git_branch]
format = "[$symbol$branch ](bg:green fg:dark)"

[git_status]
# 背景の green (#41af1a) の上で読める色は dark だけ (コントラスト比 5.39。ほかの色は 1.05〜2.46) のため、
# 状態は色ではなく Nerd Font の記号 (Octicons) の形で区別する。記号は私用領域の文字なのでコードポイントで書く
format = "[$all_status$ahead_behind](bg:green fg:dark)"
conflicted = "\uf421 " # oct-alert
ahead = "\uf431 " # oct-arrow_up
behind = "\uf433 " # oct-arrow_down
diverged = "\uf443 " # oct-arrow_switch
untracked = "\uf420 " # oct-question
stashed = "\uf51e " # oct-stack
modified = "\uf459 " # oct-diff_modified
staged = "\uf457 " # oct-diff_added
renamed = "\uf45a " # oct-diff_renamed
deleted = "\uf458 " # oct-diff_removed

[nodejs]
style = "bg:bright_pink fg:dark"
format = "[$symbol($version) ]($style)"

[python]
style = "bg:bright_pink fg:dark"
format = "[$symbol($version) ]($style)"

[rust]
style = "bg:bright_pink fg:dark"
format = "[$symbol($version) ]($style)"

[golang]
style = "bg:bright_pink fg:dark"
format = "[$symbol($version) ]($style)"

[lua]
style = "bg:bright_pink fg:dark"
format = "[$symbol($version) ]($style)"

[status]
disabled = false
format = "[$symbol$status]($style) "
style = "bold red"
sigint_symbol = "\n"
recognize_signal_code = true

[character]
success_symbol = "[](muted_green)"
error_symbol = "[](muted_red)"
