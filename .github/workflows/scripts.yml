name: Scripts

on:
  push:
    paths:
      - "scripts/**"
      - "bootstrap.sh"
      - "bootstrap.ps1"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "bootstrap.sh"
      - "bootstrap.ps1"
      - ".github/workflows/scripts.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/dot.sh bootstrap.sh

  # bootstrap.ps1 は Windows 標準の Windows PowerShell 5.1 で `irm <url> | iex` として実行される。
  # irm は UTF-8 として読むため、checkout したファイルも UTF-8 として読んでから 5.1 で構文確認する
  # (5.1 の ParseFile は BOM の無い UTF-8 を ANSI として読むため使わない)
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse (irm と同じく UTF-8 として読む)
        shell: powershell
        run: |
          $src = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes("$PWD\bootstrap.ps1"))
          if ([int][char]$src[0] -eq 0xFEFF) { Write-Host "bootstrap.ps1 starts with a BOM"; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "bootstrap.ps1: no syntax errors"
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Write-Host "PSScriptAnalyzer is not installed on this runner. skip"
            exit 0
          }
          $src = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes("$PWD\bootstrap.ps1"))
          $results = Invoke-ScriptAnalyzer -ScriptDefinition $src -Severity Error, Warning
          $results | Format-Table -AutoSize RuleName, Severity, Line, Message | Out-String -Width 200 | Write-Host
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

  # bootstrap.ps1 の手順の順番・分岐・外部コマンドに渡す引数を、Windows 固有の部分をモックにして確認する
  bootstrap-ps1-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -File scripts/tests/bootstrap.test.ps1

  # 使い捨ての HOME に対して link / status / prune が各 OS で動くことを確認する
  links:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows (Git Bash) はシンボリックリンクの権限まわりが未検証のため、結果の確認用として失敗を許容する
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows で改行が CRLF に変換されると bash がスクリプトを読めないため
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - name: link / status / prune
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            export HOME="$(cygpath -u "$RUNNER_TEMP")/home"
            export APPDATA="${RUNNER_TEMP}\\appdata"
            export LOCALAPPDATA="${RUNNER_TEMP}\\localappdata"
          else
            export HOME="${RUNNER_TEMP}/home"
          fi
          mkdir -p "$HOME"
          scripts/dot.sh link
          scripts/dot.sh link
          scripts/dot.sh status
          scripts/dot.sh prune --dry-run
          scripts/dot.sh prune
          scripts/dot.sh status
