name: Scripts

on:
  push:
    paths:
      - "scripts/**"
      - "bootstrap.sh"
      - "bootstrap.ps1"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "bootstrap.sh"
      - "bootstrap.ps1"
      - ".github/workflows/scripts.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/dot.sh bootstrap.sh

  # bootstrap.ps1 は Windows PowerShell 5.1 (Windows 標準) で実行されるため、5.1 で構文を確認する
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\bootstrap.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "bootstrap.ps1: no syntax errors"

  # 使い捨ての HOME に対して link / status / prune が各 OS で動くことを確認する
  links:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows (Git Bash) はシンボリックリンクの権限まわりが未検証のため、結果の確認用として失敗を許容する
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows で改行が CRLF に変換されると bash がスクリプトを読めないため
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - name: link / status / prune
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            export HOME="$(cygpath -u "$RUNNER_TEMP")/home"
            export APPDATA="${RUNNER_TEMP}\\appdata"
            export LOCALAPPDATA="${RUNNER_TEMP}\\localappdata"
          else
            export HOME="${RUNNER_TEMP}/home"
          fi
          mkdir -p "$HOME"
          scripts/dot.sh link
          scripts/dot.sh link
          scripts/dot.sh status
          scripts/dot.sh prune --dry-run
          scripts/dot.sh prune
          scripts/dot.sh status
