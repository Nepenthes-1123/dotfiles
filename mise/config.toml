# mise のグローバル設定 (~/.config/mise にディレクトリごとリンクされる)
# OS に依存しない CLI ツールはここで管理し、3 OS で同じ方法で導入する。
# GUI アプリ・フォント・git・zsh は OS のパッケージマネージャー (scripts/packages.conf) で管理する。
#
# バージョンは固定せず "latest" で常に最新を使う。更新は `scripts/dot.sh update` (mise upgrade) で行う。
[tools]
# grep 代替 (snacks.picker / :grep のバックエンド)
ripgrep = "latest"
# GitHub CLI (octo.nvim が依存)。認証は別途 `gh auth login` を実行する
github-cli = "latest"
# プロンプト (zsh/.zsh.d/prompt.zsh)
starship = "latest"
# ファジーファインダー (zsh/.zsh.d/plugins.zsh の fzf-tab / キーバインド)
fzf = "latest"
# エージェントマルチプレクサ (herdr/config.toml)
herdr = "latest"
# エディタ本体。nvim の設定が vim.pack を使うため v0.12 以降が必要
neovim = "latest"
# Mason が npm 経由で LSP / フォーマッターをインストールするために必要
node = "lts"
# git の TUI (hunk 単位の staging・ログの閲覧)
lazygit = "latest"
# nvim-treesitter がパーサーをビルドするのに使う
tree-sitter = "latest"
# Claude Code
# 登録名は claude-code ではなく claude にする。Claude Code は自分が
# パッケージマネージャー管理下にあると `mise upgrade claude` を案内するため、
# この名前でないと案内のコマンドが空振りする (mise はレジストリ上の別エントリとして扱う)。
# 自動更新は未対応。2.1.287 の時点で、実行するコマンドの配列を返す分岐は homebrew と
# winget のみで mise は null になり、CLAUDE_CODE_PACKAGE_MANAGER_AUTO_UPDATE を設定しても
# 実行されない (起動時に「Update available! Run: mise upgrade claude」の案内は出る)。
# 更新は案内に従うか `dot.sh update` で行う。
claude = "latest"
