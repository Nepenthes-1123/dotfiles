# mise のグローバル設定 (~/.config/mise にディレクトリごとリンクされる)
# OS に依存しない CLI ツールはここで管理し、3 OS で同じバージョンを使う。
# GUI アプリ・フォント・git・zsh は OS のパッケージマネージャー (scripts/props/packages.conf) で管理する。
#
# バージョンは同じディレクトリの mise.lock で固定する。
# 更新は scripts/update.sh の `mise upgrade` で行い、mise.lock の差分をコミットする。
[tools]
# grep 代替 (snacks.picker / :grep のバックエンド)
ripgrep = "latest"
# GitHub CLI (octo.nvim が依存)。認証は別途 `gh auth login` を実行する
github-cli = "latest"
# プロンプト (zsh/.zsh.d/prompt.zsh)
starship = "latest"
# ファジーファインダー (zsh/.zsh.d/plugins.zsh の fzf-tab / キーバインド)
fzf = "latest"
# エージェントマルチプレクサ (herdr/config.toml)
herdr = "latest"
# エディタ本体。nvim の設定が vim.pack を使うため v0.12 以降が必要
neovim = "latest"
# Mason が npm 経由で LSP / フォーマッターをインストールするために必要
node = "lts"
