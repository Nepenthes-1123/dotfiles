# OS のパッケージマネージャーで入れるもの (GUI アプリ・フォント・git・zsh・mise 本体)
# OS に依存しない CLI ツール (ripgrep / gh / starship / fzf / herdr / neovim / node) は mise/config.toml で管理する

# Windows winget IDs
win_packages=(
    "wez.wezterm"
    "Microsoft.VisualStudioCode"
    "Git.Git"
    "DEVCOM.JetBrainsMonoNerdFont"
    "jdx.mise"
)

# Mac brew formulae/casks
mac_packages=(
    "wezterm"
    "visual-studio-code"
    "git"
    "font-jetbrains-mono-nerd-font"
    "mise"
)

# Ubuntu apt packages
ubuntu_packages=(
    "zsh"
    "wezterm"
    "code"
    "git"
    "mise"
)
