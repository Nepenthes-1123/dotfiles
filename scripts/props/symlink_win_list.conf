DOT_DIR="$(cd $(dirname ${BASH_SOURCE:-$0})/../..; pwd)"
symlink_list=(
# zsh 設定
"${DOT_DIR}/zsh/.zshrc|${HOME}/.zshrc" \
"${DOT_DIR}/zsh/.zsh.d|${HOME}/.zsh.d" \
# wezterm 設定
"${DOT_DIR}/wezterm/.wezterm.lua|${HOME}/.wezterm.lua" \
"${DOT_DIR}/wezterm/.wezterm|${HOME}/.wezterm" \
# vscode 設定
"${DOT_DIR}/vscode/settings.json|${APPDATA:-$HOME/AppData/Roaming}/Code/User/settings.json" \
"${DOT_DIR}/vscode/keybindings.json|${APPDATA:-$HOME/AppData/Roaming}/Code/User/keybindings.json" \
"${DOT_DIR}/vscode/snippets|${APPDATA:-$HOME/AppData/Roaming}/Code/User/snippets" \
# git 設定
"${DOT_DIR}/git/.gitconfig|${HOME}/.gitconfig" \
# nvim 設定
"${DOT_DIR}/nvim|${LOCALAPPDATA:-$HOME/AppData/Local}/nvim" \
# 追加 設定
)
