# shellcheck shell=bash
# OS のパッケージマネージャーで入れるもの (GUI アプリ・フォント・git・zsh・mise 本体)
# OS に依存しない CLI ツール (ripgrep / gh / starship / fzf / herdr / neovim / node) は mise/config.toml で管理する

# Windows: winget の ID (`ID|スコープ` と書くと --scope を付けて入れる)
# Windows 側は GUI アプリだけを入れる。zsh・mise・CLI ツールは WSL の中 (Ubuntu) で入れる。
# Git は dotfiles の clone と、このスクリプトを実行する Git Bash のために入れる
# VSCode はユーザー用とマシン全体用のインストーラーがあり、bootstrap.ps1 (管理者) から実行すると
# マシン全体用が選ばれることがあるため、普段どおりユーザー用に固定する
win_packages=(
  wez.wezterm
  "Microsoft.VisualStudioCode|user"
  Git.Git
  DEVCOM.JetBrainsMonoNerdFont
)

# macOS: brew の formula / cask
mac_packages=(
  wezterm
  visual-studio-code
  git
  font-jetbrains-mono-nerd-font
  mise
)

# Ubuntu: apt のパッケージ
# ubuntu_gui_packages と ubuntu_gui_apt_repos、Nerd Font は WSL の中では入れない (Windows 側で使うため)
ubuntu_packages=(
  zsh
  git
  mise
)
ubuntu_gui_packages=(
  wezterm
  code
)

# Ubuntu: 公式リポジトリに無いパッケージ用の apt リポジトリ
# ソースファイル名 | 鍵の保存名 (/usr/share/keyrings/) | 鍵の URL | ソースファイルの内容 (\n で改行)
# 各配布元の公式手順どおりの形式にしている (VSCode はパッケージ自身が同じファイルを管理するため形式を揃える必要がある)
ubuntu_apt_repos=(
  "mise.list|mise-archive-keyring.gpg|https://mise.jdx.dev/gpg-key.pub|deb [signed-by=/usr/share/keyrings/mise-archive-keyring.gpg] https://mise.jdx.dev/deb stable main"
)
ubuntu_gui_apt_repos=(
  "wezterm.list|wezterm-fury.gpg|https://apt.fury.io/wez/gpg.key|deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *"
  "vscode.sources|microsoft.gpg|https://packages.microsoft.com/keys/microsoft.asc|Types: deb\nURIs: https://packages.microsoft.com/repos/code\nSuites: stable\nComponents: main\nArchitectures: amd64,arm64,armhf\nSigned-By: /usr/share/keyrings/microsoft.gpg"
)

# Ubuntu: apt に無い Nerd Font は GitHub のリリースから入れる
ubuntu_nerd_font="JetBrainsMono"
ubuntu_nerd_font_version="v3.2.1"
