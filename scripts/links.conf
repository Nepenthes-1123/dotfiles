# dotfiles 内のパス | 配置先
#
# 配置先では次の変数が使える。OS ごとの違いは scripts/lib/common.sh で定義している。
#   ${HOME}            ホームディレクトリ
#   ${CONFIG_DIR}      ~/.config
#   ${VSCODE_USER_DIR} VSCode のユーザー設定ディレクトリ
#   ${NVIM_DIR}        Neovim の設定ディレクトリ (Windows は %LOCALAPPDATA%\nvim)
#   ${HERDR_DIR}       herdr の設定ディレクトリ (Windows は %APPDATA%\herdr)
#
# ディレクトリはディレクトリごとリンクする。アプリがキャッシュ等を書き込むディレクトリだけファイル単位にする。

# zsh
zsh/.zshrc                  | ${HOME}/.zshrc
zsh/.zsh.d                  | ${HOME}/.zsh.d

# wezterm
wezterm/.wezterm.lua        | ${HOME}/.wezterm.lua
wezterm/.wezterm            | ${HOME}/.wezterm

# vscode (User ディレクトリには状態ファイルも置かれるため、ファイル単位でリンクする)
vscode/settings.json        | ${VSCODE_USER_DIR}/settings.json
vscode/keybindings.json     | ${VSCODE_USER_DIR}/keybindings.json
vscode/snippets             | ${VSCODE_USER_DIR}/snippets

# git
git/.gitconfig              | ${HOME}/.gitconfig

# neovim
nvim                        | ${NVIM_DIR}

# herdr
herdr/config.toml           | ${HERDR_DIR}/config.toml

# starship
starship/starship.toml      | ${CONFIG_DIR}/starship.toml

# mise
mise                        | ${CONFIG_DIR}/mise
