# dotfiles 内のパス | 配置先 | 対象 (省略時は cli)
#
# 対象は、どの環境でリンクするかを表す。
#   gui: GUI アプリの設定。mac・Ubuntu・Windows 側 (Git Bash) でリンクし、WSL の中ではリンクしない
#   cli: シェル・CLI ツールの設定。mac・Ubuntu・WSL の中でリンクし、Windows 側ではリンクしない
#   all: Windows 側と WSL の中の両方で使うツールの設定。すべての環境でリンクする
#
# 配置先では次の変数が使える。OS ごとの違いは scripts/lib/common.sh で定義している。
#   ${HOME}            ホームディレクトリ
#   ${CONFIG_DIR}      ~/.config
#   ${VSCODE_USER_DIR} VSCode のユーザー設定ディレクトリ (Windows は %APPDATA%\Code\User)
#   ${NVIM_DIR}        Neovim の設定ディレクトリ (Windows は %LOCALAPPDATA%\nvim)
#   ${LAZYGIT_DIR}     lazygit の設定ディレクトリ (macOS は ~/Library/Application Support/lazygit)
#
# ディレクトリはディレクトリごとリンクする。アプリがキャッシュ等を書き込むディレクトリだけファイル単位にする。

# zsh
zsh/.zshenv                 | ${HOME}/.zshenv
zsh/.zshrc                  | ${HOME}/.zshrc
zsh/.zsh.d                  | ${HOME}/.zsh.d
zsh/.zprofile               | ${HOME}/.zprofile

# wezterm (Windows では Windows 側で動くため gui)
wezterm/.wezterm.lua        | ${HOME}/.wezterm.lua             | gui
wezterm/.wezterm            | ${HOME}/.wezterm                 | gui

# vscode (User ディレクトリには状態ファイルも置かれるため、ファイル単位でリンクする)
vscode/settings.json        | ${VSCODE_USER_DIR}/settings.json    | gui
vscode/keybindings.json     | ${VSCODE_USER_DIR}/keybindings.json | gui
vscode/snippets             | ${VSCODE_USER_DIR}/snippets         | gui

# git
git/.gitconfig              | ${HOME}/.gitconfig

# neovim (WSL の中に加え、Windows 側でも PowerShell から使うため all)
nvim                        | ${NVIM_DIR}                      | all

# herdr
herdr/config.toml           | ${CONFIG_DIR}/herdr/config.toml

# lazygit (ディレクトリには lazygit が状態のファイルを書き込むため、ファイル単位でリンクする)
lazygit/config.yml          | ${LAZYGIT_DIR}/config.yml

# starship
starship/starship.toml      | ${CONFIG_DIR}/starship.toml

# mise
mise                        | ${CONFIG_DIR}/mise

# Claude Code (~/.claude には認証情報や会話の記録も置かれるため、ファイル単位でリンクする)
claude/CLAUDE.md            | ${HOME}/.claude/CLAUDE.md
claude/settings.json        | ${HOME}/.claude/settings.json
